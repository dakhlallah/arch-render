interface:
  display_name: "ARCHI Rendering Studio"
  short_description: "Preservation-first architectural visualization"
  icon_small: "./assets/logo.png"
  icon_large: "./assets/logo.png"
  brand_color: "#000000"
  default_prompt: "Use $arch-render to create or review an architectural visualization while preserving the supplied design."
dependencies:
  tools:
    - type: "mcp"
      value: "magnific"
      description: "Optional Magnific rendering and upscaling integration"
      transport: "streamable_http"
      url: "https://mcp.magnific.com"
policy:
  allow_implicit_invocation: true
